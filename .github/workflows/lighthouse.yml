name: lighthouse-regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Build
        env:
          DATABASE_URL: "postgres://stub:stub@localhost:5432/stub"
          DIRECT_URL: "postgres://stub:stub@localhost:5432/stub"
          AUTH_SECRET: "stub-stub-stub-stub-stub-stub-stub-32"
          AUTH_URL: "http://localhost:3000"
          RESEND_API_KEY: "re_stub"
          CRON_SECRET: "stub"
          ANTHROPIC_API_KEY: "sk-ant-stub"
          STRIPE_SECRET_KEY: "sk_test_stub"
        run: pnpm build

      - name: Start server in background
        env:
          DATABASE_URL: "postgres://stub:stub@localhost:5432/stub"
          DIRECT_URL: "postgres://stub:stub@localhost:5432/stub"
          AUTH_SECRET: "stub-stub-stub-stub-stub-stub-stub-32"
          AUTH_URL: "http://localhost:3000"
          RESEND_API_KEY: "re_stub"
          CRON_SECRET: "stub"
          ANTHROPIC_API_KEY: "sk-ant-stub"
          STRIPE_SECRET_KEY: "sk_test_stub"
        run: |
          pnpm start &
          # Wait for server
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null && break
            sleep 2
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/en
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
